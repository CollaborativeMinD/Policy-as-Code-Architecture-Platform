[project]
name = "hmt-postgresql-design-patterns"
version = "1.0.0"
description = "Governed PostgreSQL driver, delivery, streaming, and authority references"
requires-python = ">=3.12,<3.14"
dependencies = [
  "psycopg[binary,pool]==3.3.7", "psycopg-pool==3.3.3", "asyncpg==0.32.0",
  "sqlalchemy[asyncio]==2.1.8", "sqlmodel==0.0.48", "pydantic==2.14.2",
  "polars==2.1.0", "pyrsistent==0.20.0", "redis==8.1.0",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "pytest-cov==7.1.0",
  "coverage==7.17.1", "hypothesis==6.170.14", "ruff==0.17.3",
  "asyncpg-stubs==0.32.0",
  "duckdb==2.0.0", "jsonschema==4.26.0", "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: pure contracts", "negative: forbidden inputs or effects",
  "mutation: guard removal witnesses", "behavioral: lifecycle behavior",
  "api: public boundary", "boundary: bounds and discontinuities",
  "security: adversarial inputs", "temporal: freshness and revocation",
  "speed: bounded work witness", "regex: syntax controls",
  "integration: coupled components", "e2e: complete reference flow",
  "causal: deletion/restoration/control/compensation", "native: native service qualification",
]

[tool.coverage.run]
branch = true
source = ["hmt_pg_patterns"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Closed contracts intentionally reject bool/int coercion and subclass substitution.
# Attribute count is a style heuristic; the V2 physical LOC limits remain unchanged.
[tool.pylint.design]
max-attributes = 13

[tool.pylint.messages_control]
disable = ["unidiomatic-typecheck"]
