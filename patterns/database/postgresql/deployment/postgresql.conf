# PG-OPS-001: selected server prerequisites; certificate files are provisioned secrets.
fsync = on
full_page_writes = on
synchronous_commit = on
wal_level = replica
ssl = on
ssl_cert_file = '/run/secrets/postgresql/server.crt'
ssl_key_file = '/run/secrets/postgresql/server.key'
ssl_ca_file = '/run/secrets/postgresql/ca.crt'
password_encryption = 'scram-sha-256'
statement_timeout = '5s'
lock_timeout = '1s'
idle_in_transaction_session_timeout = '10s'
log_statement = 'none'
log_min_error_statement = 'panic'
