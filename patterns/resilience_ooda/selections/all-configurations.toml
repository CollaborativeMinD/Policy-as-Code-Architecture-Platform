version = 1
catalog = "resilience-ooda@1"
name = "resilience-ooda-all"

[profiles.delivery]
kind = "ooda"
attempts = 3
window_ns = 10_000_000_000
attempt_bound_ns = 750_000_000
fallback_reserve_ns = 100_000_000
uncertainty_ns = 10_000_000
backoff_ns = 50_000_000

[profiles.lookup]
kind = "basic"
attempts = 3
backoff_ms = 0

[profiles.optional_lookup]
kind = "filtering"
attempts = 2
backoff_ms = 0
trigger = "missing_result"

[profiles.connection_lookup]
kind = "filtering"
attempts = 2
backoff_ms = 0
trigger = "connection_error"

[profiles.logged_validation]
kind = "logging"
attempts = 2
backoff_ms = 0

[profiles.async_lookup]
kind = "async"
attempts = 3
backoff_ms = 0

[profiles.fixed_lookup]
kind = "waiting"
attempts = 3
strategy = "fixed"
delay_ms = 10

[profiles.jittered_lookup]
kind = "waiting"
attempts = 3
strategy = "random"
min_ms = 10
max_ms = 30

[profiles.backoff_lookup]
kind = "waiting"
attempts = 3
strategy = "exponential"
multiplier_ms = 5
min_ms = 10
max_ms = 30
